# ===========================================================================
#  Codebase 1 - hierarchical MMM: run settings
# ===========================================================================
#  EVERY key below is shown at its DEFAULT value, so this file doubles as the
#  reference for what the pipeline does when you say nothing. Delete anything
#  you are happy with - omitted keys fall back to exactly these values.
#
#  Run it:
#      from settings import run_from_yaml
#      result = run_from_yaml("config.yaml")
#  or, from a shell:
#      python settings.py config.yaml
#
#  Regenerate this file (e.g. after upgrading the codebase):
#      python settings.py --write config.yaml
#
#  A typo is an ERROR, not a silent default: an unknown key stops the run and
#  names the closest valid spelling.
#
#  The FEATURES and their priors are not here - they live in the CSV named by
#  data.feature_priors, because a per-feature prior table belongs in a table.
#  See docs/TUNING_GUIDE.md for which knob to reach for in which situation.
# ===========================================================================


# --------------------------------------------------------------------------
# Where the inputs are. Paths are relative to this file unless absolute.
# --------------------------------------------------------------------------
data:
  # panel file: one row per region x date, columns date/region/dv/features
  input_path: input_datacube.xlsx
  # Excel sheet name (null = first sheet). Ignored for .csv/.parquet
  sheet: null
  # the feature/prior table - the list of modelled columns
  feature_priors: feature_priors.csv
  # explicit strptime format for the date column (null = infer)
  date_format: null
  # OPTIONAL. vendor_variable, our_variable[, region][, contribution] - which vendor variable is
  # which of ours. Replicate the vendor name across rows when we split it (period / sub-brand),
  # or ours when they do. Every our_variable must be in data.feature_priors (which may carry
  # more). Groups the benchmark sheet; WITH contributions it also drives the pre-model prior
  # builder (case a) and pre-fills the sheet's benchmark cells. Sample:
  # samples/mapping_sample.csv
  mapping_file: null
  # OPTIONAL. section, pillar, pillar_share_pct, variable, spend, variable_share_pct[,
  # sign_constraint]. Sections: media, expert, comp_media, trade, baseline. Builds the prior
  # file from shares of sales when the mapping has no contributions (cases b and c); always
  # supplies pillars and the baseline flag. Sample: samples/share_sample.csv
  share_file: null
  # the per-region KPI level a generated coefficient is expressed against: mean (default) | sum
  # | median. It must equal run.dv_scale, so keep mean and set run.dv_scale: mean when fitting
  # with generated priors - the pre-model step warns otherwise
  dv_aggregation: mean
  # how the per-region coefficients become ONE national prior: average (default - their mean,
  # the centre of the regions; right for pooling hierarchical/independent) | weighted
  # (SUM(contribution)/SUM(support x dv_agg) - the coefficient that reproduces the national
  # TOTAL; right for pooling: global). They differ when a contribution is concentrated in a few
  # regions; the step warns and the workbook prints both
  national_basis: average
  # where the pre-model step writes feature_priors_national.csv, feature_priors_regional.csv and
  # the calculation workbook. null = pre_model_outputs/
  pre_model_dir: null


# --------------------------------------------------------------------------
# The statistical model: what terms exist and how strong the baseline priors are.
# --------------------------------------------------------------------------
model:
  # 'normal' | 'student_t'. student_t is robust to promo/holiday spikes
  likelihood: student_t
  # annual seasonality harmonics. 0 = no seasonality block. 2 is a good start
  fourier_order: 0
  # period of the seasonal cycle in days (365.25 = annual)
  fourier_period_days: 365.25
  # add a pooled per-region linear time trend
  include_trend: false
  # keep the region intercept alpha_g. false removes it entirely, so no ESTIMATED term can
  # absorb sales the drivers should be explaining - reach for it when the intercept has eaten
  # the decomposition. Note the level does not vanish: with run.dv_center: mean the baseline
  # becomes the FIXED historical mean (zero posterior width) instead of a free parameter. Only
  # sane with run.dv_center: mean
  include_intercept: false
  # prior sd of the POPULATION intercept (KPI is standardised, so 0.5 is wide)
  alpha_prior_sd: 0.5
  # prior scale of how far region intercepts spread around it
  alpha_regional_sd: 0.5
  # partial-pool the per-region noise level. false = independent sigma per region
  pool_sigma: true


# --------------------------------------------------------------------------
# Data handling, the KPI scale (= the unit your priors live in) and run bookkeeping.
# --------------------------------------------------------------------------
run:
  # output folder name. Change it every run or you overwrite the last one
  run_name: run
  # parent directory the run folder is created in
  output_dir: outputs
  # name of the date column in the input file
  date_col: date
  # name of the region column
  region_col: region
  # name of the KPI/dependent column. Pass it RAW - scaling happens here
  dv_col: dv
  # 'mean' | 'none' - what is subtracted from the KPI before fitting
  dv_center: none
  # 'none'|'sd'|'mean'|'mean_positive'|'max' - the unit your PRIORS live in
  dv_scale: mean
  # 'region' (own scale each) | 'global' (one number for all regions)
  dv_scale_scope: region
  # 'train' | 'full' - which periods the centring/scaling statistics come from, for features AND
  # the KPI. 'full' matches the window generated priors were computed over, but the holdout
  # metrics are then not strictly out of sample. CV always uses each fold's train window
  scaling_window: train
  # 'auto'|'weekly'|'monthly' - sets every period count downstream
  cadence: auto
  # last N dates held out per region for OOS metrics, as an ABSOLUTE count. null = use
  # holdout_fraction / the cadence policy
  holdout_periods: null
  # holdout as a FRACTION of the panel, so it follows the data: 0.125 is 13 weeks on 2 years and
  # 26 on 4. Ignored when holdout_periods is an integer. null = the policy default (0.125)
  holdout_fraction: null
  # posterior draws used for the decomposition and plots
  report_draws: 400
  # 'warn' | 'fail' - 'fail' refuses to persist an unconverged fit
  on_convergence_failure: warn
  # snap |v| < this * max|v| to 0 before scaling. ~1e-6 kills adstock dust
  zero_threshold_rel: 0.0
  # reject a scale-only feature whose scaling factor is below this
  min_feature_scale: 1.0e-12
  # warn when an always-on uncentred feature has sd / level below this (collinear with alpha)
  near_constant_sd: 0.1


# --------------------------------------------------------------------------
# MCMC settings. Nothing here changes the model, only how well it is explored.
# --------------------------------------------------------------------------
sampler:
  # posterior draws kept per chain
  draws: 1000
  # warmup/adaptation steps per chain (discarded)
  tune: 1000
  # independent chains. 4 is the minimum for a trustworthy R-hat
  chains: 4
  # NUTS acceptance target. Raise toward 0.99 to clear divergences
  target_accept: 0.92
  # random seed - set it, so a run is reproducible
  seed: 42
  # 'numpyro' (JAX/GPU) | 'pymc' | 'advi'
  sampler: numpyro
  # numpyro only: 'sequential' | 'parallel' | 'vectorized' (best on one GPU)
  chain_method: vectorized
  # extra kwargs for the NUTS kernel only (mapping, {} for none)
  nuts_kwargs: {}
  # prior draws - these feed the contraction report, keep >= 500
  prior_predictive_draws: 500
  # keep pointwise log-lik for LOO/WAIC. Makes the trace much bigger
  store_log_likelihood: false
  # sampler: advi only - mean-field VI iterations
  advi_iters: 30000
  # false = a failed GPU run raises instead of silently going to CPU
  allow_sampler_fallback: false


# --------------------------------------------------------------------------
# Which files each stage writes. The CORE tables are always written.
# --------------------------------------------------------------------------
output:
  # 01_data: every row exactly as the model sees it
  model_input_matrix: true
  # 01_data: per region x feature scaled-column statistics
  model_input_summary: true
  # 01_data: kpi_by_region.png
  data_plots: true
  # 01_data: VIF, Belsley condition number and correlated column pairs, measured on the MODEL's
  # design matrix (intercept + Fourier + trend + features), per region. Pre-fit: what the DATA
  # can separate
  collinearity: true
  # 01_data: what each written prior means as a coefficient distribution
  prior_summary: true
  # 02_convergence: prior_posterior_contraction.png
  contraction_plot: true
  # 02_convergence: the three-curve prior/data/posterior chart per parameter
  prior_posterior_plots: true
  # cap on how many of those charts to draw (largest mean shift first)
  prior_posterior_max: 60
  # include mu_alpha/tau_alpha/z_alpha/alpha_region in the CONTRACTION report and its charts.
  # false hides them when the intercept is a nuisance level. Never affects convergence tables or
  # reconciliation
  report_intercept: true
  # 03_coefficients: per-feature forest plot across regions
  forest_plots: true
  # 04_fit: row-level actual / fitted / residual
  actual_vs_predicted: true
  # 04_fit: linearity, homoscedasticity, autocorrelation, residual tails and influence, plus
  # which coefficient pairs are trading off in the posterior. Post-fit: what the MODEL could
  # separate
  assumption_checks: true
  # 04_fit: fit and residual charts
  fit_plots: true
  # 05_contributions: the vendor-style volume + % table
  contribution_summary: true
  # 05_contributions: volume per region x date x driver (large file)
  contribution_timeseries: true
  # 05_contributions: the beta x sum(x) x dv_scale audit trail
  contribution_math: true
  # 05_contributions: components -> fitted -> actual
  contribution_reconciliation: true
  # 05_contributions: benchmark_comparison.xlsx - paste a benchmark contribution into one column
  # and %diff, the ratio, delta and the corrected global_prior_mean recalculate live. Needs
  # contribution_math
  benchmark_comparison: true
  # 05_contributions: contribution bars and stacked decomposition
  contribution_plots: true
  # 'none' | 'week' | 'year' | 'mat' - reporting blocks in contribution_summary
  period_split: mat
  # 'auto'|'weekly'|'monthly' - sets the MAT block length (52 weekly / 12 monthly)
  cadence: auto
  # also dump the pre-scaling feature values
  include_raw_features: true
  # region of practical equivalence on the SCALED coefficient axis. Gives prob_negligible, the
  # only non-vacuous 'significance' for a sign-constrained feature (whose p_value is 0 by
  # construction). 0 = skip
  rope_scaled: 0.01
  # resolution of every chart. 160 stays legible pasted into a deck
  fig_dpi: 160
  # multiplies every figure size. Raise for projection, lower to fit a page
  fig_scale: 1.4


# --------------------------------------------------------------------------
# Thresholds for every collinearity and assumption check. Widen or narrow here, not in code.
# --------------------------------------------------------------------------
assumptions:
  # VIF flagged as moderate. Textbook 5 (Meridian uses 1000 - see MERIDIAN_ASSUMPTIONS.md)
  vif_warn: 5.0
  # VIF flagged as severe. Textbook 10
  vif_bad: 10.0
  # Belsley condition number, moderate
  cond_warn: 10.0
  # Belsley condition number, severe. This is what catches a feature that duplicates the
  # intercept
  cond_bad: 30.0
  # |corr| between design columns to report. SET 0 TO LIST EVERY PAIR
  pair_warn: 0.8
  # |corr| above which a pair is called severe
  pair_bad: 0.95
  # how many culprits to name per feature ('explained by A, B and C'). 0 = off
  vif_top_k: 3
  # write 01_data/collinearity_heatmap_<region>.png
  corr_heatmap: true
  # above this many features a heatmap is unreadable; the highest-VIF ones are kept
  heatmap_max_features: 40
  # |corr| between coefficient DRAWS - the pair is trading off
  post_corr_warn: 0.7
  # ...severe
  post_corr_bad: 0.9
  # Durbin-Watson lower bound. Below this = positive residual autocorrelation
  dw_lo: 1.5
  # Durbin-Watson upper bound
  dw_hi: 2.5
  # |corr(residual, fitted)| above which the functional form is questioned
  linearity_max_corr: 0.2
  # sd(resid) in the top third of fitted values / the bottom third
  hetero_ratio_max: 1.5
  # |autocorrelation| at lags 2/4/13
  acf_max: 0.3
  # |skew| of the standardised residuals
  skew_max: 1.0
  # excess kurtosis before student_t is recommended
  kurtosis_max: 1.0
  # |standardised residual| counted as an influential point
  influence_sd: 3.0
  # cross-correlate each feature against the residual over +/- this many periods
  exogeneity_max_lags: 4
  # |cross-correlation| to flag, floored at 2/sqrt(n) on short panels
  exogeneity_warn: 0.2
  # |corr(treatment, control)| - Meridian's bar, also floored at 2/sqrt(n)
  confound_warn: 0.1
  # aggregate posterior predictive p-value below which the total is implausible
  ppp_fail: 0.05
  # P(baseline < 0) that triggers a review
  neg_baseline_review: 0.2
  # P(baseline < 0) that fails
  neg_baseline_fail: 0.8


# --------------------------------------------------------------------------
# Expanding-window cross-validation, used only by cross_validation.run_cv().
# --------------------------------------------------------------------------
cv:
  # run expanding-window cross-validation after the main fit. Off by default: every fold is a
  # FULL refit, so a 5-fold CV costs roughly 5x the headline run. Turn it on once the single fit
  # looks sane. Outputs land in 06_cross_validation/
  enabled: false
  # 'auto'|'weekly'|'monthly' - the preset every null below is filled from
  cadence: auto
  # test periods per fold, ABSOLUTE. null -> horizon_fraction, then the policy (12.5% of the
  # panel: 13 on a 2-year weekly panel, 26 on 4)
  horizon: null
  # test periods per fold as a fraction of the panel. null = the policy
  horizon_fraction: null
  # number of expanding-window folds (null -> 5 weekly / 3 monthly)
  n_folds: null
  # periods between fold origins (null -> horizon)
  step: null
  # shortest training window, ABSOLUTE. null -> min_train_fraction, then the policy (50% of the
  # panel, never under one year)
  min_train_periods: null
  # shortest training window as a fraction of the panel
  min_train_fraction: null
  # override sampler.draws for CV speed (null -> preset)
  draws: null
  # override sampler.tune for CV speed (null -> preset)
  tune: null
  # write the CV accuracy charts
  make_plots: true
