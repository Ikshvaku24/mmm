command: [
  "streamlit",
  "run",
  "app.py"
]

env:
  - name: CLIENT_ID
    valueFrom: CLIENT_ID
  - name: TENANT_ID
    valueFrom: TENANT_ID
  - name: CLIENT_SECRET
    valueFrom: CLIENT_SECRET
  - name: ACCOUNT_NAME
    valueFrom: ACCOUNT_NAME
  - name: FILE_SYSTEM
    valueFrom: FILE_SYSTEM
  - name: DATABRICKS_TOKEN
    valueFrom: DATABRICKS_TOKEN
  - name: MDR_JOB_ID
    valueFrom: MDR_JOB_ID
  # the company theme shown until a viewer picks the other one (the logos in
  # the side panel switch it, per person, no redeploy) - themes/haleon.toml or
  # themes/capgemini.toml: colours, fonts and corners, light and dark
  - name: STREAMLIT_THEME_BASE
    value: "themes/haleon.toml"
  # the ⋮ menu's developer items off; the page hides the menu itself (the
  # cluster sits there) but needs it: the light / dark button uses its Settings
  - name: STREAMLIT_CLIENT_TOOLBAR_MODE
    value: "viewer"
