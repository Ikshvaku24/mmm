command: [
  "streamlit",
  "run",
  "app.py"
]

env:
  - name: CLIENT_ID
    valueFrom: CLIENT_ID
  - name: TENANT_ID
    valueFrom: TENANT_ID
  - name: CLIENT_SECRET
    valueFrom: CLIENT_SECRET
  - name: ACCOUNT_NAME
    valueFrom: ACCOUNT_NAME
  - name: FILE_SYSTEM
    valueFrom: FILE_SYSTEM
  - name: DATABRICKS_TOKEN
    valueFrom: DATABRICKS_TOKEN
  - name: MDR_JOB_ID
    valueFrom: MDR_JOB_ID
  # the company theme that leads - themes/haleon.toml (default) or
  # themes/capgemini.toml: colours, fonts and corners, light and dark; the
  # logos and accents follow it (src/brand.py)
  - name: STREAMLIT_THEME_BASE
    value: "themes/haleon.toml"
  # no ⋮ menu in the top-right corner - the cluster sits there
  - name: STREAMLIT_CLIENT_TOOLBAR_MODE
    value: "minimal"
