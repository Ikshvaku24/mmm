# BRIDGE's Streamlit settings for a run on a laptop (`streamlit run app.py` in
# this folder). On Databricks, app.yml's environment variables set the same two
# things and win over this file.

[client]
# the ⋮ menu's developer items off; the page hides the menu itself (the cluster
# sits there) but needs it: the light / dark button uses its Settings
toolbarMode = "viewer"

[theme]
# the company theme shown until a viewer picks the other one (the logos in
# the side panel switch it, per person): "themes/haleon.toml" (default) or
# "themes/capgemini.toml" - colours, fonts and corners, light and dark
base = "themes/haleon.toml"
